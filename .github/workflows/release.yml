name: Build and Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to, empty to only build
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: secure-screen-lab-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
